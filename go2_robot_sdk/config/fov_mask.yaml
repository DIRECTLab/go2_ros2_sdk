# Shared field-of-view mask for cross-robot comparison.
#
# The point of this file is that BOTH robots load the SAME one. The Go2's lidar
# is factory-mounted inverted (165 deg) and the rover's L2 is upright, so the
# only way their clouds describe the same content is to reduce both to an
# identical band of the world. Copy this file to the rover's stack rather than
# maintaining two sets of numbers.
#
# `mask_frame` is the exception: it must name the physically equivalent frame on
# each robot, which differs by tf_prefix (go2/base_footprint vs
# ganon/base_footprint). The launch files pass it as a direct override.
#
# Keyed '/**' on purpose. A key of 'fov_mask_node:' would never match, because
# PushRosNamespace makes the node /go2/fov_mask_node -- the same bare-key/FQN
# mismatch recorded as bugs #6 and #8 in docs/SWARM_SLAM_FINDINGS.md, which cost
# a long debug when nav2 and the EKF silently ignored their params.
/**:
  ros__parameters:

    # Two independent frame settings, both overridden per robot by the launch
    # files (their values carry each robot's tf_prefix, so they cannot live in a
    # file that is meant to be shared).
    #
    # mask_frame supplies the mask AXES and the z datum. Options that matter:
    #   <prefix>/base_footprint -- sits on the ground on both robots by
    #       construction, so a z band means the same height above the floor on
    #       each. Moves with the robot, and on a legged robot it is derived from
    #       a body that bobs.
    #   <prefix>/odom -- fixed and gravity-aligned, so it does not bob with the
    #       gait. But each robot's odom origin sits at a different height (the
    #       Go2's floor measured z = -0.128 m in go2/odom, section 4), so a
    #       shared z band needs a per-robot offset to stay comparable.
    mask_frame: base_footprint

    # mask_origin is where range, azimuth and elevation are measured FROM.
    # 'sensor' keeps the field of view attached to the robot even when
    # mask_frame is a fixed odom frame -- without this, setting mask_frame to
    # odom would make the range band a shell around wherever the robot booted.
    # 'mask_frame' measures from that frame's origin; any other value is treated
    # as an explicit frame id and resolved through TF.
    mask_origin: sensor

    # 'input' is a pure filter: surviving points keep their original frame and
    # bytes. Switch to 'mask' to co-register both feeds into mask_frame for a
    # side-by-side comparison.
    publish_frame: input

    # -- z band ---------------------------------------------------------------
    # The primary knob. ScanContext bins by x,y and stores max(z+2.0) per cell
    # (SWARM_SLAM_FINDINGS.md section 4), so z is what actually has to match.
    # A z band also excludes the floor uniformly at every range, which an
    # elevation band cannot.
    #
    # Starting point from section 4's post-fix table, where the rover measured
    # z 5/50/95 = +0.05/+0.25/+0.85 and the Go2 +0.01/+0.11/+0.74:
    #   z_min above the floor, z_max below the ceiling.
    z_min: 0.18
    z_max: 2.0

    # -- range band -----------------------------------------------------------
    # 'horizontal' matches ScanContext's x,y binning; 'euclidean' matches
    # datasheet slant-range specs. Capping the rover (30 m) to the Go2's reach
    # keeps both feeding the same rings -- section 4 found both robots populated
    # only 2-3 of ScanContext's 20 rings.
    range_mode: horizontal
    min_range: 0.1
    max_range: 4.5

    # -- self-hit blanking ----------------------------------------------------
    # Drops everything within this euclidean radius of the SENSOR origin, to
    # remove returns off the lidar's own mount. Separate from min_range on
    # purpose: this is always a sphere measured from the cloud frame origin,
    # regardless of range_mode (which stays 'horizontal' for ScanContext) and
    # regardless of mask_origin -- the mount is bolted to the sensor, so it
    # does not move when the measurement origin does. 0 disables.
    #
    # This value is physical, not a shared-band setting: the Go2's factory head
    # mount and the rover's L2 mast are different hardware, so the two robots
    # may legitimately need different numbers here. Override per robot with
    # `-p sensor_blank_radius:=...` rather than forking the file.
    #
    # Tune it from the retention stats: raise it until the `sens_r` 5th
    # percentile clears your mount, then stop -- every extra centimetre is
    # real geometry thrown away.
    sensor_blank_radius: 0.68

    # -- elevation cone -------------------------------------------------------
    # Unbounded by default. Use this to emulate the cone one sensor physically
    # cannot see beyond on the other robot, not to exclude the floor.
    # Measured from mask_origin, in mask_frame's axes.
    elev_min_deg: -90.0
    elev_max_deg: 90.0

    # -- azimuth sector -------------------------------------------------------
    # Full circle. Set a wedge to restrict both robots to a forward-facing view.
    # If azim_min > azim_max the sector wraps through +/-180.
    azim_min_deg: -180.0
    azim_max_deg: 180.0

    # -- decay / accumulation -------------------------------------------------
    # Accumulates points over time, like RViz2's Decay Time property. This
    # switches what the single `cloud_processed` topic carries: per-scan masked
    # clouds when 0, the accumulated history when set.
    #
    # 0 disables it, matching RViz where 0 means "show only the newest cloud".
    #
    # Leave it at 0 when feeding scan-to-map odometry such as KISS-ICP: it is
    # sequential and deskews using the per-point time offsets, which are
    # relative to their own sweep.
    #
    # cslam is more tolerant -- ScanContext bins by x,y and stores max(z+2.0),
    # so sweep boundaries do not matter to it, and it was already consuming the
    # Go2's accumulated WebRTC voxel map rather than per-sweep data. The catch
    # is pose association: each keyframe carries one odometry pose, so a cloud
    # spanning several poses yields a loop-closure transform that is not a
    # transform between two robot poses.
    # Both robots carry non-repetitive L2 scanners: each sweep covers only a
    # fraction of the FOV and successive sweeps sample different directions, so
    # one sweep is a sparse slice of the room rather than a picture of it.
    # Accumulating is how a complete picture is formed -- normal operation for
    # this sensor class, not a density optimisation.
    #
    # Same sensor on both robots, so this value is SHARED and should match:
    # identical coverage-vs-time keeps the two clouds comparable. (Contrast
    # sensor_blank_radius, which describes mount hardware and is per-robot.)
    #
    # Size it from the stats line -- raise until the accumulated point count
    # stops growing, which is the sensor's coverage time. While moving, keep
    # speed * decay_time below cslam's voxel_size (0.3 m) or the smear blurs
    # the cells you were filling.
    decay_time: 1.0

    # The frame accumulation happens in. MUST be fixed with respect to the
    # world -- odom or map, never base_link or base_footprint. Stacking scans
    # in a frame that rides the robot piles every sweep at the current pose
    # instead of sweeping out the room. Overridden per robot by the launch
    # files, since the value carries each robot's tf_prefix.
    #
    # This is deliberately independent of mask_frame: the mask may legitimately
    # be evaluated in a moving frame, accumulation may not.
    decay_frame: odom

    # Hard cap; oldest clouds are evicted first once it is reached. RViz has no
    # equivalent because it is bounded by a render budget -- an unbounded buffer
    # in a node would just grow.
    decay_max_points: 2000000

    # -- motion compensation --------------------------------------------------
    # One transform per sweep smears the cloud by however far the robot moved
    # during it. Rotation dominates and the error scales with RANGE, so it hits
    # exactly the distant returns that carry the distinctive geometry:
    # at 0.5 rad/s over a 0.1 s sweep, a point at 5 m is displaced 0.25 m --
    # about one cslam voxel. Accumulating N sweeps stacks N such errors; they
    # do not cancel.
    #
    # With this on, the transform is sampled at sweep start and sweep end and
    # interpolated per point using the offsets the sensor already reports.
    # Falls back to a single transform, counted in the stats, when a cloud has
    # no usable time field.
    deskew: true

    # When no transform exists at the cloud's stamp, use the latest available
    # one rather than dropping the cloud. Convenient, but for accumulation it
    # silently misplaces WHOLE clouds by however far the robot moved in the gap,
    # which is far worse than intra-sweep smear. Either way the gap is warned
    # about and counted as `TF stale xN, last skew +X.XXXs` in the stats.
    #
    # A large and steady skew is the signature of a clock-domain mismatch: the
    # raw lidar feed is stamped from the robot's clock while odom is stamped
    # from this machine's. Fix that before trusting any accumulated output.
    tf_allow_stale: true

    # Subscription queue depth for /tf. tf2 defaults to 100, which at a 20 Hz
    # broadcaster is five seconds of backlog -- and because /tf is RELIABLE, a
    # consumer that falls behind works through that queue in order instead of
    # jumping to the newest, turning a brief stall into a standing multi-second
    # lag. A shallow queue drops stale samples instead; TF interpolates the
    # gaps. Raise it if transforms genuinely arrive in large bursts.
    tf_queue_depth: 10

    tf_timeout: 0.1

    # Retention reports every N seconds. These percentiles are what you tune
    # against: adjust the band until both robots retain overlapping
    # distributions. 0 disables.
    stats_period: 5.0
